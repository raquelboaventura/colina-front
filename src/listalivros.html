<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colina - Livros</title>
    <link rel="stylesheet" href="assets/css/style-listalivros.css">
</head>

<body>

    <header>
        <div class="container">
            <div class="title"><a href="home.html" class="botao-home">Colina</a></div>
            <div class="search">
                <form id="search-form" action="/buscar" method="GET">
                    <input type="text" id="search-input" name="q" placeholder="Pesquisar..." />
                    <button type="submit">Buscar</button>
                </form>
            </div>
            <div class="actions">
                <a>Meu Perfil</a>
                <a>Opções</a>
                <a>Sair</a>
                <img class="icone-teste" src="assets/img/icone-teste.jpg" alt="">
            </div>
        </div>
    </header>

    <main>
        <h2>Olá, Usuário.</h2>
        <h1>Lista de Livros</h1>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Capa/Titulo</th>
                        <th>ISBN</th>
                        <th>QTD</th>
                        <th>Escritor(A)</th>
                        <th>Editora</th>
                        <th>Preço</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="livros-tbody">
                    <!-- o js q faz isso aq -->
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 QuelBVT & Cia desenvolvimento </p>
    </footer>

    <!-- Modal de Edição -->
    <div id="modal-edicao" class="modal">
        <div class="modal-content">
            <span class="close" id="fechar-modal-edicao">&times;</span>
            <h2>Editar Livro</h2>
            <form id="form-editar-livro">
                <input type="hidden" id="edit-id_livro" />

                <label for="edit-titulo">Título:</label>
                <input type="text" id="edit-titulo" required />

                <label for="edit-autor">Autor:</label>
                <input type="text" id="edit-autor" required />

                <label for="edit-editora">Editora:</label>
                <input type="text" id="edit-editora" required />

                <label for="edit-isbn">ISBN:</label>
                <input type="text" id="edit-isbn" required />

                <label for="edit-paginas">Páginas:</label>
                <input type="number" id="edit-paginas" required />

                <label for="edit-publicacao">Publicação:</label>
                <input type="date" id="edit-publicacao" required />

                <label for="edit-genero">Gênero:</label>
                <input type="text" id="edit-genero" required />

                <label for="edit-quantidade">Quantidade:</label>
                <input type="number" id="edit-quantidade" required />

                <label for="edit-preco">Preço:</label>
                <input type="number" step="0.01" id="edit-preco" required />

                <button type="submit">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <script src="assets/js/script-listalivros.js"></script>
</body>

</html>
