<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colina - Clientes</title>
    <link rel="stylesheet" href="assets/css/style-listacliente.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="title"><a href="home.html" class="botao-home">Colina</a></div>
            <div class="search">
                <form id="search-form" action="/buscar" method="GET">
                    <input type="text" id="search-input" name="q" placeholder="Pesquisar..." />
                    <button type="submit">Buscar</button>
                </form>
            </div>
            <div class="actions">
                <a>Meu Perfil</a>
                <a>Opções</a>
                <a>Sair</a>
                <img class="icone-teste" src="assets/img/icone-teste.jpg" alt="">
            </div>
        </div>
    </header>

    <main>
        <h1>Lista de Clientes</h1>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="clientes-tbody">
                    <!-- conteúdo JS vai aqui -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- MODAL DE EDIÇÃO DE CLIENTE -->
    <div id="modal-cliente" class="modal">
        <div class="modal-content">
            <span class="close" id="fecharModalCliente">&times;</span>
            <h2>Editar Cliente</h2>
            <form id="clienteForm">
                <input type="hidden" id="clienteId" name="id">

                <label for="clienteNome">Nome:</label>
                <input type="text" id="clienteNome" name="nome" required>

                <label for="clienteCpf">CPF:</label>
                <input type="text" id="clienteCpf" name="cpf" required>

                <button type="submit">Salvar</button>
                <button type="submit" class ="btnExcluir">Excluir</button>
            </form>
        </div>
    </div>


    <footer>
        <p>&copy; 2025 QuelBVT & Cia desenvolvimento</p>
    </footer>

    <script type="module" src="assets/js/script-listacliente.js"></script>
</body>

</html>
